---
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f7f8f5">
    <meta name="description" content="TruFed s.r.o. — software solutions for businesses.">
    <title>TruFed s.r.o. — Business software</title>
    <link rel="stylesheet" href="/site.css">
    <style>
        :root {
            color-scheme: light;
            --ink: #17231e;
            --muted: #68736d;
            --paper: #f7f8f5;
            --line: #e5e9e3;
            --green: #b7ee78;
            --deep-green: #315940;
        }

        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            min-width: 320px;
            margin: 0;
            background:
                radial-gradient(ellipse at 79% 38%, rgba(196, 229, 174, 0.26), transparent 34rem),
                var(--paper);
            color: var(--ink);
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        a {
            color: inherit;
        }

        .page {
            display: flex;
            min-height: 100svh;
            flex-direction: column;
            overflow: hidden;
        }

        .topbar,
        .footer {
            display: flex;
            width: min(100% - 96px, 1240px);
            align-items: center;
            justify-content: space-between;
            margin-inline: auto;
        }

        .topbar {
            min-height: 100px;
        }

        .brand {
            display: inline-flex;
            align-items: center;
            gap: 11px;
            text-decoration: none;
        }

        .brand-mark {
            display: grid;
            width: 36px;
            height: 36px;
            place-items: center;
            border-radius: 12px;
            background: var(--ink);
            color: var(--green);
            font-size: 15px;
            font-weight: 750;
            letter-spacing: -0.08em;
        }

        .brand-name {
            font-size: 16px;
            font-weight: 680;
            letter-spacing: -0.045em;
        }

        .brand-name span {
            color: var(--muted);
            font-size: 13px;
            font-weight: 450;
            letter-spacing: -0.02em;
        }

        .top-note {
            color: var(--muted);
            font-size: 13px;
        }

        main {
            display: flex;
            flex: 1;
            flex-direction: column;
            align-items: stretch;
        }

        .hero {
            display: grid;
            width: min(100% - 96px, 1240px);
            grid-template-columns: 1.02fr 0.98fr;
            align-items: center;
            gap: 64px;
            margin: 0 auto;
            padding: 46px 0 78px;
        }

        .eyebrow {
            display: inline-flex;
            align-items: center;
            gap: 9px;
            margin: 0 0 28px;
            color: var(--deep-green);
            font-size: 12px;
            font-weight: 650;
            letter-spacing: 0.11em;
            text-transform: uppercase;
        }

        .eyebrow::before {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #79b958;
            content: "";
        }

        h1 {
            max-width: 620px;
            margin: 0;
            font-size: clamp(54px, 7.3vw, 98px);
            font-weight: 570;
            letter-spacing: -0.085em;
            line-height: 0.98;
        }

        h1 span {
            color: #82948a;
        }

        .intro {
            max-width: 390px;
            margin: 28px 0 32px;
            color: var(--muted);
            font-size: 17px;
            line-height: 1.7;
        }

        .text-link {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            padding-bottom: 5px;
            border-bottom: 1px solid #aeb8b0;
            font-size: 14px;
            font-weight: 620;
            text-decoration: none;
            transition: gap 180ms ease, border-color 180ms ease;
        }

        .text-link:hover {
            gap: 17px;
            border-color: var(--ink);
        }

        .text-link span {
            color: var(--deep-green);
            font-size: 18px;
        }

        .visual {
            position: relative;
            display: grid;
            min-height: 440px;
            place-items: center;
            isolation: isolate;
        }

        .visual::before {
            position: absolute;
            z-index: -1;
            width: min(100%, 470px);
            aspect-ratio: 1;
            border: 1px solid rgba(89, 116, 94, 0.13);
            border-radius: 50%;
            content: "";
        }

        .visual::after {
            position: absolute;
            z-index: -1;
            width: min(77%, 365px);
            aspect-ratio: 1;
            border: 1px solid rgba(89, 116, 94, 0.13);
            border-radius: 50%;
            content: "";
        }

        .orbit-dot {
            position: absolute;
            top: 16%;
            right: 16%;
            width: 13px;
            height: 13px;
            border: 3px solid var(--paper);
            border-radius: 50%;
            background: #90c977;
            box-shadow: 0 0 0 1px rgba(49, 89, 64, 0.25);
        }

        .footer {
            min-height: 78px;
            border-top: 1px solid var(--line);
            color: var(--muted);
            font-size: 12px;
        }

        .content-section {
            width: min(100% - 96px, 1240px);
            margin: 0 auto;
            padding: 64px 0;
            border-top: 1px solid var(--line);
        }

        .content-section h2 {
            margin: 0 0 32px;
            font-size: clamp(30px, 4vw, 48px);
            font-weight: 570;
            letter-spacing: -0.065em;
        }

        .feature-grid,
        .preview-grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 20px;
        }

        .feature {
            min-height: 150px;
            padding: 24px;
            border: 1px solid var(--line);
            border-radius: 16px;
            background: rgba(255, 255, 255, 0.62);
        }

        .feature h3 {
            margin: 0;
            font-size: 18px;
            font-weight: 570;
            letter-spacing: -0.04em;
        }

        .preview {
            min-height: 210px;
            padding: 17px;
            border: 1px solid var(--line);
            border-radius: 16px;
            background: rgba(255, 255, 255, 0.72);
        }

        .preview-bar,
        .preview-line,
        .preview-block {
            border-radius: 5px;
            background: #e9eee7;
        }

        .preview-bar {
            width: 43%;
            height: 9px;
            margin-bottom: 22px;
            background: #c8e8b7;
        }

        .preview-line {
            width: 100%;
            height: 7px;
            margin: 12px 0;
        }

        .preview-line.short {
            width: 64%;
        }

        .preview-block {
            height: 76px;
            margin-top: 19px;
            background: linear-gradient(90deg, #e9eee7 32%, #c8e8b7 32%, #c8e8b7 58%, #e9eee7 58%);
        }

        .section-links {
            display: flex;
            flex-wrap: wrap;
            gap: 14px;
        }

        @media (max-width: 760px) {
            .topbar,
            .footer,
            .hero {
                width: min(100% - 44px, 520px);
            }

            .topbar {
                min-height: 78px;
            }

            .hero {
                grid-template-columns: 1fr;
                gap: 20px;
                padding: 62px 0 54px;
            }

            .content-section {
                width: min(100% - 44px, 520px);
                padding: 48px 0;
            }

            .feature-grid,
            .preview-grid {
                grid-template-columns: 1fr;
            }

            h1 {
                max-width: 500px;
                font-size: clamp(46px, 12.5vw, 84px);
            }

            .visual {
                min-height: 350px;
            }

            .visual::before {
                width: min(90%, 350px);
            }

            .visual::after {
                width: min(70%, 275px);
            }

            .orbit-dot {
                top: 13%;
                right: 17%;
            }

            .footer {
                min-height: 68px;
            }
        }

        @media (max-width: 390px) {
            .footer {
                align-items: flex-start;
                flex-direction: column;
                justify-content: center;
                gap: 8px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            html {
                scroll-behavior: auto;
            }

            *,
            *::before,
            *::after {
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body>
    <div class="page">
        {% include site-header.html %}

        <main>
            <section class="hero" aria-labelledby="hero-title">
                <div class="hero-copy">
                    <p class="eyebrow">TruFed s.r.o.</p>
                    <h1 id="hero-title">Software for <span>businesses.</span></h1>
                    <a class="text-link" href="#product">Our Product / Solution <span aria-hidden="true">↘</span></a>
                </div>

                <div class="visual" aria-hidden="true">
                    <span class="orbit-dot"></span>
                </div>
            </section>

            <section class="content-section" id="product" aria-labelledby="product-title">
                <h2 id="product-title">Our Product / Solution</h2>
                <div class="feature-grid">
                    <article class="feature"><h3>Location management</h3></article>
                    <article class="feature"><h3>Reviews</h3></article>
                    <article class="feature"><h3>Feedback analysis</h3></article>
                </div>
            </section>

            <section class="content-section" aria-labelledby="previews-title">
                <h2 id="previews-title">Product interface previews</h2>
                <div class="preview-grid" aria-label="Product interface previews">
                    <div class="preview" role="img" aria-label="Interface preview 1">
                        <div class="preview-bar"></div><div class="preview-line"></div><div class="preview-line short"></div><div class="preview-block"></div>
                    </div>
                    <div class="preview" role="img" aria-label="Interface preview 2">
                        <div class="preview-bar"></div><div class="preview-line"></div><div class="preview-line short"></div><div class="preview-block"></div>
                    </div>
                    <div class="preview" role="img" aria-label="Interface preview 3">
                        <div class="preview-bar"></div><div class="preview-line"></div><div class="preview-line short"></div><div class="preview-block"></div>
                    </div>
                </div>
            </section>

            <section class="content-section" aria-label="Company information">
                <div class="section-links">
                    <a class="text-link" href="/about/">About TruFed <span aria-hidden="true">↗</span></a>
                    <a class="text-link" href="/contact/">Contact <span aria-hidden="true">↗</span></a>
                </div>
            </section>
        </main>

        {% include site-footer.html %}
    </div>
</body>
</html>
